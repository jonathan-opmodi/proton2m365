name: "Want: Gmail as a destination"
description: "Ask for migrating a Proton export into Gmail (labels kept)."
labels: ["want: gmail"]
body:
  - type: markdown
    attributes:
      value: |
        Today proton2m365 migrates into Microsoft 365 and Outlook.com only. A Gmail destination is planned once enough people ask (this form counts).
        One issue per person is enough; if one already exists, a thumbs-up on it counts too.
  - type: dropdown
    id: size
    attributes:
      label: How much would you bring?
      options:
        - "under 100 items"
        - "100 to 1,000"
        - "1,000 to 10,000"
        - "more than 10,000"
        - "not sure"
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: What you would use it for, or what would make it work for you. Please leave out names and addresses.
    validations:
      required: false
